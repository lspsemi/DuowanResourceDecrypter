plugins {
    id "com.android.application"
}

android {
    namespace "com.example.dwdecryptor"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.dwdecryptor"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a"
        }
    }
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
}
